<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATHOPOLY — Monopoli Matematika</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <h1>🎲 MATHOPOLY</h1>
      <p>Jawab soal, beli properti, dan kumpulkan uang!</p>
    </header>

    <div class="layout">
      <div class="board-wrap">
        <section id="board" class="board" aria-label="Papan permainan"></section>
      </div>

      <aside class="panel">
        <h2>Permainan</h2>

        <div class="player-setup">
          <label for="playerCount">Jumlah pemain</label>
          <select id="playerCount">
            <option value="2">2 orang</option>
            <option value="3">3 orang</option>
            <option value="4">4 orang</option>
            <option value="5">5 orang</option>
            <option value="6">6 orang</option>
            <option value="7">7 orang</option>
            <option value="8">8 orang</option>
            <label for="startingMoney">Uang awal tiap pemain</label>
              <input
                id="startingMoney"
                type="number"
                min="1"
                step="100"
                value="1500"
              />
          </select>

          <div id="playerNames" class="player-names"></div>
          <button id="startButton" type="button">Mulai Permainan</button>
        </div>

        <div id="players" class="players"></div>

        <div class="dice-display" aria-live="polite">
          <i id="diceIcon" class="fas fa-dice-one" aria-label="Dadu"></i>
          <span id="diceResult">—</span>
        </div>

        <button id="rollButton" type="button" disabled>Lempar Dadu</button>
        <button id="resetButton" class="secondary" type="button">Mulai Ulang</button>

        <div id="status" class="status" aria-live="polite">
          Atur pemain, lalu tekan Mulai Permainan.
        </div>

        <form id="questionForm" class="question">
          <p id="questionText"></p>
          <div class="answer-row">
            <input
              id="answerInput"
              name="answer"
              type="number"
              inputmode="numeric"
              placeholder="Jawaban"
              required
            />
            <button type="submit">Jawab</button>
          </div>
          <p class="hint">Jawab benar untuk membeli properti.</p>
        </form>
      </aside>
    </div>
  </main>

  <div id="communityPopup" class="community-overlay" role="dialog" aria-modal="true">
    <div class="community-box">
      <h2 id="communityTitle"></h2>
      <p id="communityDescription"></p>
      <button id="communityOk" type="button">Oke</button>
    </div>
  </div>

  <div id="challengePopup" class="popup-overlay" role="dialog" aria-modal="true">
    <div class="popup-card">
      <h2>Kartu Tantangan</h2>
      <p id="challengeProgress"></p>
      <p id="challengeQuestion"></p>
      <div id="challengeOptions"></div>
      <p id="challengeFeedback" aria-live="polite"></p>
    </div>
  </div>
</body>
</html>
